name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Remove broken test dirs
        run: |
          rm -rf android/app/src/androidTest
          rm -rf android/app/src/test
      - name: Create cordova.variables.gradle
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          cat > android/capacitor-cordova-android-plugins/cordova.variables.gradle << 'GRADLE'
ext { cordovaPlugins = [] }
GRADLE
      - name: Patch build.gradle
        run: |
          sed -i '/apply from:.*cordova/d' android/build.gradle || true
          sed -i '/apply from:.*cordova/d' android/app/build.gradle || true
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug -x test -x lint --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
